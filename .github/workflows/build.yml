name: Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: x64
            arch: x64
            out_dir: x64/Release/
          - runner: windows-11-arm
            platform: ARM64
            arch: ARM64
            out_dir: ARM64/Release/
          - runner: windows-latest
            platform: x86
            arch: x86
            out_dir: Win32/Release/

    runs-on: ${{ matrix.runner }}
    name: Build (${{ matrix.arch }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # resource.h is the one place the version lives; don't repeat it here.
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String src\DeskFlip\resource.h -Pattern '#define VER_DISPLAY\s+"(.+)"').Matches[0].Groups[1].Value
          "ver=$v" >> $env:GITHUB_OUTPUT

      # /t:DeskFlip, or the solution's MSIX project builds the exe three times over.
      - name: Build DeskFlip
        run: |
          msbuild src\DeskFlip.slnx /t:DeskFlip /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskFlip_${{ steps.ver.outputs.ver }}_${{ matrix.arch }}
          path: |
            src/${{ matrix.out_dir }}DeskFlip.exe
            src/${{ matrix.out_dir }}lang
